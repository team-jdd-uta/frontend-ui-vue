server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/chat/rooms {
        proxy_pass http://backend-room-service:8082/rooms;
    }

    location ^~ /api/chat/rooms/ {
        rewrite ^/api/chat/rooms/(.*)$ /rooms/$1 break;
        proxy_pass http://backend-room-service:8082;
    }

    location = /api/chat/message {
        proxy_pass http://backend-chat-service:8083/chat/message;
    }

    location ^~ /api/users/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-user-service:8084;
    }

    location ^~ /api/comments/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-user-service:8084;
    }

    location = /api/categories {
        proxy_pass http://backend-user-service:8084/categories;
    }

    location = /api/regiester {
        proxy_pass http://backend-login-service:8081/register;
    }

    location ~ ^/api/(login|register|logout)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-login-service:8081;
    }

    location ^~ /api/summaries/ {
        proxy_pass http://backend-redis-stream-mongo-consumer:3000;
    }

    location ^~ /api/rooms/ {
        proxy_pass http://backend-redis-stream-mongo-consumer:3000;
    }

    location ^~ /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://backend-socket-io-gateway:3000;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"API route is not configured"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
